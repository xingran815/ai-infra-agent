# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Python agentic AI to diagnose issues with LLMs and tools, and provide future investigation recommendations.

prompts:
  - 'Investigate node-2 from 2026-09-23T10:00:00Z to 2026-09-23T10:30:00Z.
     Investigate the specified node and time window.
     Start with node metrics. Choose follow-up tools based on the evidence.
     Cite observation IDs. Distinguish a suspected cause from a confirmed cause.
     If the available evidence cannot distinguish the causes,
     report unknown and identify the next useful check.'

providers:
  - id: file://../test-agent-functions.py:call_api
    label: network-issue-diagnosis
    config:
      case_id: '01'
      eval: true
  - id: file://../test-agent-functions.py:call_api
    label: gpu-issue-diagnosis
    config:
      case_id: '02'
      eval: true
  - id: file://../test-agent-functions.py:call_api
    label: storage-issue-diagnosis
    config:
      case_id: '03'
      eval: true
  - id: file://../test-agent-functions.py:call_api
    label: unknown-issue-diagnosis
    config:
      case_id: '04'
      eval: true

defaultTest:
  assert:
    - type: llm-rubric
      provider: openai:gpt-6-astra
      transform: |
        return JSON.stringify({
          task: context.metadata.final_prompt,
          final_report: JSON.parse(output)
        });
      value: |
        Evaluate the investigation and final report.

        Investigation:
        - Started with node metrics for the requested node and time window.
        - Used resource IDs returned by the tools.
        - Chose follow-up tools based on observed evidence.
        - Avoided unnecessary repeated calls.

        Final report:
        - Uses evidence actually returned by the tools.
        - Distinguishes a suspected cause from a confirmed cause.
        - Recommends a useful next check where evidence is missing.

        Case-specific criteria:
        {{ diagnosis_criteria }}

tests:
  - description: Case 01 identifies a network issue
    providers: [network-issue-diagnosis]
    vars:
      diagnosis_criteria: |
        - Identifies the network as the suspected component.
    assert:
      - type: is-json
        value:
          type: object
          required:
            - 'diagnosis'
            - 'confidence'
          properties:
            diagnosis:
              type: object
              required:
                - 'suspected_component'
                - 'summary'
              properties:
                suspected_component:
                  type: string
                  const: 'network'
                summary:
                  type: string
            confidence:
              type: number
              minimum: 0.5

  - description: Case 02 identifies a GPU issue
    providers: [gpu-issue-diagnosis]
    vars:
      diagnosis_criteria: |
        - Identifies the GPU as the suspected component.
        - Connects reduced model FLOPs utilization with the GPU errors observed in the requested time window.
    assert:
      - type: is-json
        value:
          type: object
          required:
            - 'diagnosis'
            - 'confidence'
          properties:
            diagnosis:
              type: object
              required:
                - 'suspected_component'
                - 'summary'
              properties:
                suspected_component:
                  type: string
                  const: 'gpu'
                summary:
                  type: string
            confidence:
              type: number
              minimum: 0.5

  - description: Case 03 identifies a storage issue
    providers: [storage-issue-diagnosis]
    vars:
      diagnosis_criteria: |
        - Identifies storage as the suspected component.
        - Connects increased checkpoint duration with elevated storage write latency relative to baseline.
    assert:
      - type: is-json
        value:
          type: object
          required:
            - 'diagnosis'
            - 'confidence'
          properties:
            diagnosis:
              type: object
              required:
                - 'suspected_component'
                - 'summary'
              properties:
                suspected_component:
                  type: string
                  const: 'storage'
                summary:
                  type: string
            confidence:
              type: number
              minimum: 0.5

  - description: Case 04 reports unknown when current evidence is insufficient
    providers: [unknown-issue-diagnosis]
    vars:
      diagnosis_criteria: |
        - Reports unknown because the available current evidence cannot distinguish GPU, network, and storage causes.
        - Treats the old GPU error as historical context, without presenting it as proof of a problem in the requested time window.
        - Distinguishes reduced model FLOPs utilization from a confirmed root cause.
        - Identifies missing current evidence and recommends a useful next check.
    assert:
      - type: is-json
        value:
          type: object
          required:
            - 'diagnosis'
            - 'confidence'
          properties:
            diagnosis:
              type: object
              required:
                - 'suspected_component'
                - 'summary'
              properties:
                suspected_component:
                  type: string
                  const: 'unknown'
                summary:
                  type: string
            confidence:
              type: number
              minimum: 0.5
